<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The shell embeds no frame that fetches: a shared app's realm is a srcdoc frame, and this keeps it
         from navigating itself anywhere (#272, docs/22 §3.2). In a <meta> so the Capacitor WebView, which
         serves no headers, has it too; the same policy is a header in vite.config.ts and deploy/. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1b1c" media="(prefers-color-scheme: dark)" />
    <title>Potyro</title>
    <!-- What a pasted link to the app shows in a chat or a feed: the site's own words and picture
         (site/words.json, potyro.com/media/og.png). A shared app's link has its own (docs/24). -->
    <meta name="description" content="Describe the app you need in a sentence, or write the code yourself. It runs on your phone, your data stays yours, and a link shares it. Free, no account." />
    <meta property="og:site_name" content="Potyro" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://potyro.app/" />
    <meta property="og:title" content="Potyro — the app you need, made by you" />
    <meta property="og:description" content="Describe the app you need in a sentence, or write the code yourself. It runs on your phone, your data stays yours, and a link shares it. Free, no account." />
    <meta property="og:image" content="https://potyro.com/media/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Potyro. The app you need, made by you. Describe it in a sentence, or write the code yourself. potyro.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Opaque and 180px, as iOS wants it: a transparent icon gets black corners on the home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Added to the home screen (#123): full screen, under its own name, the status bar over the page's
         own background. iOS reads these; Chrome reads the manifest and wants the plain name too. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Potyro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Potyro" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
