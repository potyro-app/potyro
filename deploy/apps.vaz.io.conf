# Potyro — apps.vaz.io
#
# Two things are served from one origin, deliberately:
#   /sync   the CRDT relay (a websocket, proxied to a container on 127.0.0.1:4201)
#   /       the static shell, with an SPA fallback
#
# Same origin is not incidental. The shell derives its relay URL from its own origin
# (wss://<host>/sync), so proxying this one path is what makes sync work with no build-time
# configuration — and the browser sends the same basic-auth credentials on the websocket upgrade,
# so ONE gate covers both. A relay on a separate host would need its own gate and its own
# credentials.
#
# The relay is unauthenticated in itself. The basic auth below is the only thing in front of it.
# See docs/16-deployment.md § "What this does NOT protect".

<VirtualHost *:80>
    ServerName apps.vaz.io
    Redirect permanent / https://apps.vaz.io/
    ErrorLog  ${APACHE_LOG_DIR}/karta-error.log
    CustomLog ${APACHE_LOG_DIR}/karta-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName apps.vaz.io

    SSLEngine on
    SSLProtocol ALL -SSLv2 -SSLv3
    SSLHonorCipherOrder On
    # The vaz.io certificate is a wildcard (*.vaz.io), so apps.vaz.io needs no certificate of its
    # own and nothing here has to change when it renews.
    SSLCertificateFile      /etc/letsencrypt/live/vaz.io/cert.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/vaz.io/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/vaz.io/fullchain.pem

    DocumentRoot /var/www/karta
    <Directory /var/www/karta>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The private-test gate. Covers the websocket too: it is the same origin, so the browser
    # replays these credentials on the upgrade request.
    <Location "/">
        AuthType Basic
        AuthName "Potyro"
        AuthUserFile /etc/apache2/karta.htpasswd
        Require valid-user
    </Location>

    RewriteEngine On

    # The relay, FIRST. An upgrade request is proxied as a websocket; anything else on /sync goes
    # to the same place over http, so a misconfiguration reports itself instead of being silently
    # answered with index.html by the SPA rule below.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/sync(.*)$ ws://127.0.0.1:4201$1 [P,L]
    RewriteRule ^/sync(.*)$ http://127.0.0.1:4201$1 [P,L]
    ProxyPreserveHost On
    # A sync connection is long-lived and mostly idle; the default timeout would drop it.
    ProxyTimeout 600

    # SPA: every path that is not a real file is the shell.
    #
    # Tested against DOCUMENT_ROOT + REQUEST_URI, not REQUEST_FILENAME. In VirtualHost context
    # REQUEST_FILENAME is still the URI — mod_rewrite runs before the URL is mapped to a path — so
    # `!-f` was true for everything and every real asset was answered with index.html. The icons and
    # the manifest came back as text/html, which is a broken PWA that looks like a working site.
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule . /index.html [L]

    # The shell embeds no frame that fetches (#272, docs/22 §3.2). A shared app's logic runs in a
    # sandboxed srcdoc iframe — not a fetch, so it still loads — and this is what stops that frame
    # navigating itself to a URL, which its sandbox allows and its own CSP cannot. index.html carries
    # the same policy as a <meta> (all the Capacitor WebView gets); this is it again as a header, on
    # every response. `always`, so error pages carry it too.
    Header always set Content-Security-Policy "frame-src 'none'"

    # Hashed asset filenames can be cached forever. index.html and the service worker must NOT be,
    # or a deploy stays invisible until someone clears their cache.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    <Location "/sw.js">
        Header set Cache-Control "no-cache"
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/karta-error.log
    CustomLog ${APACHE_LOG_DIR}/karta-access.log combined
</VirtualHost>
